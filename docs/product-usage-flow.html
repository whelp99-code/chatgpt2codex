<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>연결에서 증거까지 · ChatGPT To Codex</title>
  <link href="https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&family=Geist:wght@400;500;600&family=Geist+Mono:wght@400;500;600&display=swap" rel="stylesheet">
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    :root {
      --paper: #f5f5f5;
      --ink: #2d3142;
      --muted: #4f5d75;
      --soft: #7a8399;
      --accent: #eb6c36;
      --accent-tint: rgba(235,108,54,.08);
      --rule: rgba(45,49,66,.12);
      --label-rule: rgba(45,49,66,.20);
      --lane: rgba(45,49,66,.018);
      --node: #fff;
      --node-stroke: rgba(45,49,66,.25);
      --chip: rgba(45,49,66,.12);
      --dot: rgba(45,49,66,.10);
      --fl: #9c6b50;
      --wb: #6e6479;
      --govern: #b85450;
      --sans: 'Geist', system-ui, sans-serif;
      --serif: 'Instrument Serif', serif;
      --mono: 'Geist Mono', ui-monospace, monospace;
    }
    body {
      font-family: var(--sans);
      background: var(--paper);
      color: var(--ink);
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 3rem 2rem;
    }
    .frame { max-width: 960px; width: 100%; }
    .eyebrow {
      font: 500 .66rem var(--mono);
      letter-spacing: .18em;
      text-transform: uppercase;
      color: var(--muted);
      margin-bottom: .5rem;
    }
    h1 {
      font: 400 clamp(1.5rem, 2.4vw + .75rem, 2rem)/1.15 var(--serif);
      letter-spacing: -.02em;
      margin-bottom: .5rem;
    }
    .lede {
      font: 400 14px/1.4 var(--serif);
      font-style: italic;
      color: var(--muted);
      margin-bottom: 1.5rem;
    }
    svg { width: 100%; min-width: 840px; display: block; }
    svg text { font-family: var(--sans); }
    .mono { font-family: var(--mono); }
    .lane { fill: var(--lane); }
    .rule { stroke: var(--rule); }
    .label-rule { stroke: var(--label-rule); }
    .actor { fill: var(--muted); font: 500 8px var(--mono); letter-spacing: .08em; }
    .step-label { fill: var(--muted); font: 500 6px var(--mono); letter-spacing: .12em; }
    .step-chip { fill: var(--chip); }
    .step-num { fill: var(--ink); font: 600 7px var(--mono); }
    .connector { fill: none; stroke: var(--muted); stroke-width: 1; }
    .connector.focal { stroke: var(--accent); stroke-width: 1.2; }
    .node-mask { fill: var(--paper); }
    .node { fill: var(--node); stroke: var(--node-stroke); }
    .node.focal { fill: var(--accent-tint); stroke: var(--accent); stroke-width: 1.2; }
    .role { fill: rgba(45,49,66,.10); }
    .role.focal { fill: rgba(235,108,54,.25); }
    .role-text { fill: var(--ink); font: 600 6px var(--mono); }
    .role-text.focal { fill: var(--accent); }
    .node-title { fill: var(--ink); font: 600 9px var(--sans); }
    .node-sub { fill: var(--muted); font: 6.5px var(--mono); }
    .node-tool { fill: var(--soft); font: 6.5px var(--mono); }
    .data-text { fill: white; font: 700 5px var(--mono); }
    .legend-key { fill: var(--muted); font: 500 7px var(--mono); letter-spacing: .12em; }
    .legend-text { fill: var(--muted); font: 8px var(--sans); }
  </style>
</head>
<body>
  <div class="frame">
    <p class="eyebrow">Process · Product usage</p>
    <h1>연결에서 증거까지</h1>
    <p class="lede">ChatGPT는 생각하고, 로컬 런타임이 움직이며, 통과는 화면과 리포트로만 말한다. 실패하면 같은 후보를 고치고 검증을 다시 돌린다.</p>
    <svg viewBox="0 0 840 376" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="product-usage-flow-title product-usage-flow-desc">
      <title id="product-usage-flow-title">연결에서 증거까지</title>
      <desc id="product-usage-flow-desc">소유자가 프로젝트를 고르고 MCP를 켠 뒤 ChatGPT가 Owner Token으로 연결하고, 런타임이 가드된 도구와 verification_run을 실행해 스크린샷과 리포트 증거를 ChatGPT에 돌려주는 사용 흐름.</desc>
      <defs>
        <pattern id="dots" width="22" height="22" patternUnits="userSpaceOnUse">
          <circle cx="11" cy="11" r="0.8" fill="var(--dot)"/>
        </pattern>
        <marker id="arrow" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#4f5d75"/></marker>
        <marker id="arrow-accent" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#eb6c36"/></marker>
        <marker id="arrow-sm" markerWidth="6" markerHeight="5" refX="5" refY="2.5" orient="auto"><polygon points="0 0, 6 2.5, 0 5" fill="#4f5d75"/></marker>
      </defs>
      <rect width="840" height="376" fill="#f5f5f5"/>
      <rect width="840" height="376" fill="url(#dots)" opacity=".55"/>
      <rect class="lane" x="140" y="36" width="700" height="80"/>
      <rect class="lane" x="140" y="196" width="700" height="80"/>
      <g class="rule" stroke-width=".8">
        <line x1="0" y1="36" x2="840" y2="36"/>
        <line x1="0" y1="116" x2="840" y2="116"/>
        <line x1="0" y1="196" x2="840" y2="196"/>
        <line x1="0" y1="276" x2="840" y2="276"/>
      </g>
      <line class="label-rule" x1="140" y1="36" x2="140" y2="276"/>
      <g class="actor" text-anchor="middle">
        <text x="70" y="80">OWNER</text>
        <text x="70" y="160">CHATGPT</text>
        <text x="70" y="240">RUNTIME</text>
      </g>
      <g text-anchor="middle">
        <rect class="step-chip" x="190" y="8" width="16" height="16" rx="8"/><text class="step-num" x="198" y="19">1</text><text class="step-label" x="198" y="32">SETUP</text>
        <rect class="step-chip" x="302" y="8" width="16" height="16" rx="8"/><text class="step-num" x="310" y="19">2</text><text class="step-label" x="310" y="32">START</text>
        <rect class="step-chip" x="414" y="8" width="16" height="16" rx="8"/><text class="step-num" x="422" y="19">3</text><text class="step-label" x="422" y="32">LINK</text>
        <rect class="step-chip" x="526" y="8" width="16" height="16" rx="8"/><text class="step-num" x="534" y="19">4</text><text class="step-label" x="534" y="32">WORK</text>
        <rect x="638" y="8" width="16" height="16" rx="8" fill="rgba(235,108,54,.20)"/><text x="646" y="19" fill="#eb6c36" font-size="7" font-weight="600" class="mono">5</text><text x="646" y="32" fill="#eb6c36" font-size="6" font-weight="500" letter-spacing=".12em" class="mono">CHECK</text>
        <rect class="step-chip" x="750" y="8" width="16" height="16" rx="8"/><text class="step-num" x="758" y="19">6</text><text class="step-label" x="758" y="32">PROOF</text>
      </g>
      <path class="connector" d="M248 76 H302 Q310 76 310 84 V204" marker-end="url(#arrow)"/>
      <path class="connector" d="M360 236 H414 Q422 236 422 228 V188" marker-end="url(#arrow)"/>
      <path class="connector" d="M472 156 H526 Q534 156 534 164 V204" marker-end="url(#arrow)"/>
      <line class="connector focal" x1="584" y1="236" x2="596" y2="236" marker-end="url(#arrow-accent)"/>
      <path class="connector focal" d="M696 236 H750 Q758 236 758 228 V188" marker-end="url(#arrow-accent)"/>
      <g text-anchor="middle">
        <g>
          <rect class="node-mask" x="148" y="44" width="100" height="64" rx="6"/>
          <rect class="node" x="148" y="44" width="100" height="64" rx="6"/>
          <rect class="role" x="152" y="48" width="20" height="10" rx="2"/>
          <text class="role-text" x="162" y="56">OWN</text>
          <text class="node-title" x="198" y="70">폴더 선택</text>
          <text class="node-sub" x="198" y="84">folder → workspace</text>
          <text class="node-tool" x="198" y="96">menu bar</text>
          <rect x="228" y="98" width="16" height="8" rx="2" fill="var(--fl)"/>
          <text class="data-text" x="236" y="104">FL</text>
        </g>
        <g>
          <rect class="node-mask" x="260" y="204" width="100" height="64" rx="6"/>
          <rect class="node" x="260" y="204" width="100" height="64" rx="6"/>
          <rect class="role" x="264" y="208" width="20" height="10" rx="2"/>
          <text class="role-text" x="274" y="216">RUN</text>
          <text class="node-title" x="310" y="230">MCP 시작</text>
          <text class="node-sub" x="310" y="244">loopback · tunnel</text>
          <text class="node-tool" x="310" y="256">chatgpt2codex</text>
          <rect x="264" y="258" width="16" height="8" rx="2" fill="var(--fl)"/>
          <text class="data-text" x="272" y="264">FL</text>
          <rect x="340" y="258" width="16" height="8" rx="2" fill="var(--wb)"/>
          <text class="data-text" x="348" y="264">WB</text>
        </g>
        <g>
          <rect class="node-mask" x="372" y="124" width="100" height="64" rx="6"/>
          <rect x="372" y="124" width="100" height="64" rx="6" fill="rgba(184,84,80,.06)" stroke="rgba(184,84,80,.35)"/>
          <rect x="376" y="128" width="20" height="10" rx="2" fill="rgba(184,84,80,.18)"/>
          <text class="role-text" x="386" y="136" fill="#b85450">GPT</text>
          <text class="node-title" x="422" y="150" fill="#b85450">토큰 승인</text>
          <text class="node-sub" x="422" y="164">/mcp · Owner Token</text>
          <text class="node-tool" x="422" y="176">ChatGPT Apps</text>
          <rect x="376" y="178" width="16" height="8" rx="2" fill="var(--wb)"/>
          <text class="data-text" x="384" y="184">WB</text>
          <rect x="452" y="178" width="16" height="8" rx="2" fill="var(--wb)"/>
          <text class="data-text" x="460" y="184">WB</text>
        </g>
        <g>
          <rect class="node-mask" x="484" y="204" width="100" height="64" rx="6"/>
          <rect class="node" x="484" y="204" width="100" height="64" rx="6"/>
          <rect class="role" x="488" y="208" width="20" height="10" rx="2"/>
          <text class="role-text" x="498" y="216">RUN</text>
          <text class="node-title" x="534" y="230">도구 실행</text>
          <text class="node-sub" x="534" y="244">read · patch · shell</text>
          <text class="node-tool" x="534" y="256">MCP catalog</text>
          <rect x="488" y="258" width="16" height="8" rx="2" fill="var(--wb)"/>
          <text class="data-text" x="496" y="264">WB</text>
          <rect x="564" y="258" width="16" height="8" rx="2" fill="var(--fl)"/>
          <text class="data-text" x="572" y="264">FL</text>
        </g>
        <g>
          <rect class="node-mask" x="596" y="204" width="100" height="64" rx="6"/>
          <rect class="node focal" x="596" y="204" width="100" height="64" rx="6"/>
          <rect class="role focal" x="600" y="208" width="20" height="10" rx="2"/>
          <text class="role-text focal" x="610" y="216">RUN</text>
          <text class="node-title" x="646" y="230">검증</text>
          <text class="node-sub" x="646" y="244">build → test</text>
          <text class="node-tool" x="646" y="256">verification_run</text>
          <rect x="600" y="258" width="16" height="8" rx="2" fill="var(--fl)"/>
          <text class="data-text" x="608" y="264">FL</text>
          <rect x="676" y="258" width="16" height="8" rx="2" fill="var(--fl)"/>
          <text class="data-text" x="684" y="264">FL</text>
        </g>
        <g>
          <rect class="node-mask" x="708" y="124" width="100" height="64" rx="6"/>
          <rect class="node" x="708" y="124" width="100" height="64" rx="6"/>
          <rect class="role" x="712" y="128" width="20" height="10" rx="2"/>
          <text class="role-text" x="722" y="136">GPT</text>
          <text class="node-title" x="758" y="150">증거 표시</text>
          <text class="node-sub" x="758" y="164">screenshot · report</text>
          <text class="node-tool" x="758" y="176">imageMarkdown</text>
          <rect x="712" y="178" width="16" height="8" rx="2" fill="var(--fl)"/>
          <text class="data-text" x="720" y="184">FL</text>
        </g>
      </g>
      <g>
        <text class="legend-key" x="144" y="292">STEPS</text>
        <g text-anchor="middle">
          <rect class="step-chip" x="196" y="284" width="16" height="16" rx="8"/><text class="step-num" x="204" y="295">1</text><text class="legend-text" x="236" y="295">SETUP</text>
          <rect class="step-chip" x="276" y="284" width="16" height="16" rx="8"/><text class="step-num" x="284" y="295">2</text><text class="legend-text" x="316" y="295">START</text>
          <rect class="step-chip" x="356" y="284" width="16" height="16" rx="8"/><text class="step-num" x="364" y="295">3</text><text class="legend-text" x="392" y="295">LINK</text>
          <rect class="step-chip" x="428" y="284" width="16" height="16" rx="8"/><text class="step-num" x="436" y="295">4</text><text class="legend-text" x="468" y="295">WORK</text>
          <rect x="508" y="284" width="16" height="16" rx="8" fill="rgba(235,108,54,.20)"/><text x="516" y="295" fill="#eb6c36" font-size="7" class="mono">5</text><text x="548" y="295" fill="#eb6c36" font-size="8">CHECK</text>
          <rect class="step-chip" x="588" y="284" width="16" height="16" rx="8"/><text class="step-num" x="596" y="295">6</text><text class="legend-text" x="628" y="295">PROOF</text>
        </g>
        <text class="legend-key" x="144" y="313">DATA TYPE</text>
        <rect x="220" y="306" width="16" height="8" rx="2" fill="var(--fl)"/>
        <text class="legend-text" x="244" y="313">FL · file / report</text>
        <rect x="360" y="306" width="16" height="8" rx="2" fill="var(--wb)"/>
        <text class="legend-text" x="384" y="313">WB · connector / session</text>
        <text class="legend-key" x="560" y="313">LEFT IN · RIGHT OUT</text>
        <text class="legend-key" x="144" y="334">CONCERN</text>
        <rect x="220" y="326" width="16" height="10" rx="2" fill="rgba(184,84,80,.18)" stroke="#b85450" stroke-width=".8"/>
        <text class="legend-text" x="244" y="334">Owner Token gate</text>
        <text class="legend-key" x="144" y="355">FLOW</text>
        <line x1="200" y1="351" x2="228" y2="351" stroke="#eb6c36" stroke-width="1.2" marker-end="url(#arrow-accent)"/>
        <text class="legend-text" x="240" y="355">Critical handoff</text>
        <line x1="360" y1="351" x2="388" y2="351" stroke="#4f5d75" marker-end="url(#arrow)"/>
        <text class="legend-text" x="400" y="355">Sequential handoff</text>
      </g>
    </svg>
  </div>
</body>
</html>
